<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Denon Display</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 50px;
    }
    .card {
      background: #1e1e1e;
      display: inline-block;
      padding: 30px 50px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .bpm {
      font-size: 3rem;
      color: #00ffd5;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="track-title">Warte auf Track...</h1>
    <h3 id="track-artist">--</h3>
    <p>Deck: <span id="deck-num">--</span></p>
  </div>

  <div class="card">
    <h2>Ableton Link</h2>
    <div class="bpm"><span id="bpm-val">--</span> BPM</div>
    <p>Peers: <span id="peers-val">0</span></p>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    // Test-Log im Browser-Fenster
    console.log('Frontend Script geladen, warte auf Daten...');

    // 1. StageLinq Track-Info
    ipcRenderer.on('nowPlaying', (event, data) => {
      console.log('nowPlaying empfangen:', data);
      if (data.title) document.getElementById('track-title').innerText = data.title;
      if (data.artist) document.getElementById('track-artist').innerText = data.artist;
      if (data.deck !== undefined) document.getElementById('deck-num').innerText = data.deck;
    });

    // 2. Ableton Link BPM
    ipcRenderer.on('link-bpm', (event, bpm) => {
      console.log('link-bpm empfangen:', bpm);
      document.getElementById('bpm-val').innerText = Math.round(bpm);
    });

    // 3. Ableton Link Peers
    ipcRenderer.on('link-peers', (event, peers) => {
      console.log('link-peers empfangen:', peers);
      document.getElementById('peers-val').innerText = peers;
    });
  </script>

</body>
</html>
